<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F2F4F8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Iran Binary Option - Trading Signals PWA">
  <title>ایران باینری آپشن | سیگنال‌ها</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Splash -->
    <div id="splash" class="splash">
      <div class="splash-logo">IBO</div>
      <div class="splash-title">IBO Trading AI</div>
      <div class="splash-sub">سیگنال‌های معاملاتی هوشمند</div>
    </div>

    <!-- Main -->
    <div id="main-app" class="main-app hidden">
      <!-- Header -->
      <header class="header">
        <button class="header-btn" onclick="openScreen('settings')">☰</button>
        <span class="header-title" id="header-title">داشبورد معاملات هوشمند</span>
        <button class="header-btn" id="header-right-btn" onclick="headerRightAction()">🔔</button>
      </header>

      <!-- Sub-tabs -->
      <div class="sub-tabs" id="sub-tabs">
        <button class="sub-tab active" data-tab="0" onclick="switchTab(0)">داشبورد</button>
        <button class="sub-tab" data-tab="1" onclick="switchTab(1)">سیگنال‌ها</button>
        <button class="sub-tab" data-tab="2" onclick="switchTab(2)">عملکرد</button>
        <button class="sub-tab" data-tab="3" onclick="switchTab(3)">ابزارها</button>
      </div>

      <!-- ====== TAB 0: Dashboard ====== -->
      <div id="tab-0" class="tab-content active">
        <div id="dashboard-content"></div>
      </div>

      <!-- ====== TAB 1: Signals ====== -->
      <div id="tab-1" class="tab-content">
        <div id="signals-content"></div>
      </div>

      <!-- ====== TAB 2: Performance ====== -->
      <div id="tab-2" class="tab-content">
        <div id="performance-content"></div>
      </div>

      <!-- ====== TAB 3: Tools ====== -->
      <div id="tab-3" class="tab-content">
        <div id="tools-content"></div>
      </div>

      <!-- Bottom Nav Bar -->
      <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-item active" onclick="openScreen('home')">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">خانه</span>
        </button>
        <button class="nav-item" onclick="openScreen('subscriptions')">
          <span class="nav-icon">⭐</span>
          <span class="nav-label">اشتراک VIP</span>
        </button>
        <button class="nav-item" onclick="openScreen('journal')">
          <span class="nav-icon">📊</span>
          <span class="nav-label">ژورنال</span>
        </button>
        <button class="nav-item" onclick="openScreen('articles')">
          <span class="nav-icon">📚</span>
          <span class="nav-label">دانشنامه</span>
        </button>
        <button class="nav-item" onclick="openScreen('profile')">
          <span class="nav-icon">👤</span>
          <span class="nav-label">پروفایل</span>
        </button>
      </nav>
    </div>

    <!-- ====== SCREEN: Subscriptions ====== -->
    <div id="screen-subscriptions" class="screen hidden"></div>
    <!-- ====== SCREEN: Trade Journal ====== -->
    <div id="screen-journal" class="screen hidden"></div>
    <!-- ====== SCREEN: Articles ====== -->
    <div id="screen-articles" class="screen hidden"></div>
    <!-- ====== SCREEN: Settings ====== -->
    <div id="screen-settings" class="screen hidden"></div>
    <!-- ====== SCREEN: Profile ====== -->
    <div id="screen-profile" class="screen hidden"></div>
    <!-- ====== SCREEN: Signal History ====== -->
    <div id="screen-history" class="screen hidden"></div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()"></div>
    <div id="signal-detail-modal" class="signal-detail-modal hidden"></div>
    <div id="risk-calc-modal" class="risk-calc-modal hidden"></div>
    <div id="broker-detail-modal" class="broker-detail-modal hidden"></div>
    <div id="feedback-modal" class="feedback-modal hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
