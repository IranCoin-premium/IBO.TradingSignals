version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - APP_ENV=development
      - APP_PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ibo_admin
      - DB_PASSWORD=ibo_secure_password_placeholder
      - DB_NAME=ibo_signals_db
      - DB_SSL=false
      - JWT_SECRET=super_secret_jwt_sign_key_change_me_in_production
      - JWT_EXPIRES_IN=24h
      - LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ibo_network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ibo_admin
      - POSTGRES_PASSWORD=ibo_secure_password_placeholder
      - POSTGRES_DB=ibo_signals_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibo_admin -d ibo_signals_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ibo_network

networks:
  ibo_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
