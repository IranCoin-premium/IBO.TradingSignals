name: Release — 10-Level Gate + Signed APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release with APKs after gate passes'
        required: false
        default: 'true'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  gate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node for backend gate
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend deps
        working-directory: backend
        run: npm ci

      - name: Install Android build tools (zipalign/aapt)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-36" > /dev/null 2>&1 || true

      - name: Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Run FULL 10-LEVEL GATE
        run: bash scripts/verify-full-10level.sh

      - name: Prepare release artifacts
        if: success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/IBO-TradingSignals-${GITHUB_REF_NAME#v}-release.apk
          cp app/build/outputs/apk/debug/*.apk dist/IBO-TradingSignals-${GITHUB_REF_NAME#v}-debug.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          keytool -list -v -keystore "$GITHUB_WORKSPACE/release.keystore" -alias ${{ secrets.KEY_ALIAS }} -storepass ${{ secrets.STORE_PASSWORD }} | grep -E 'SHA256:' | head -1 > SIGNING_FINGERPRINT.txt || true

      - name: Create GitHub Release with installable APKs
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: IBO Trading Signals ${{ github.ref_name }}
          body: |
            ✅ همه‌ی ۱۰ سطح تست ۱۰۰٪ پاس شدند (backend compile/test، server-authority، security،
            migrations، UI uniformity، unit tests، APK build، installability، full health).
            📲 نصب: فایل release.apk را دانلود و نصب کنید — امضای ثابت، نصب‌به‌روزرسانی روی نسخه قبل.
            🛡 برای اطمینان از اصالت، SHA-256 فایل را با SHA256SUMS.txt مقایسه کنید.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/SIGNING_FINGERPRINT.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pwa:
    runs-on: ubuntu-latest
    needs: gate-and-release
    if: success() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pwa'

      - name: Deploy PWA to GitHub Pages
        uses: actions/deploy-pages@v4
        id: pwa-deploy
