name: Release — 10-Level Gate + Signed APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release with APKs after gate passes'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  gate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Signing material is injected ONLY via repo secrets — never committed to git.
      # Available to every step: gradle release signing validation (fail-loud) and
      # the SIGNING_FINGERPRINT derivation below.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # Where the Decode step materializes the (secret-backed) keystore; gradle reads
      # this via build.gradle.kts for "assembleRelease".
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so git describe can see tags

      - name: Decode signing keystore from secrets
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore" || { echo "::error::KEYSTORE_BASE64 secret missing or invalid"; exit 1; }
          echo "release.keystore decoded ($(wc -c < "$GITHUB_WORKSPACE/release.keystore") bytes)"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node for backend gate
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend deps
        working-directory: backend
        run: npm ci

      - name: Install Android build tools (zipalign/aapt)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-36" > /dev/null 2>&1 || true

      - name: Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Run FULL 10-LEVEL GATE
        run: bash scripts/verify-full-10level.sh

      - name: Generate version.properties from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${TAG}0.0.0"
          CODE=$((MAJOR*1000000 + MINOR*1000 + (PATCH)))
          printf 'versionCode=%s\nversionName=%s\n' "$CODE" "$TAG" > app/version.properties
          echo "generated: versionCode=$CODE versionName=$TAG"
          cat app/version.properties

      - name: Assert signing material present (fail the workflow, not silently)
        run: |
          test -s "$GITHUB_WORKSPACE/release.keystore" || { echo "::error::release.keystore missing (KEYSTORE_BASE64 decode failed)"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::STORE_PASSWORD secret missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::KEY_ALIAS secret missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::KEY_PASSWORD secret missing"; exit 1; }
          echo "signing material OK: keystore $(wc -c < "$GITHUB_WORKSPACE/release.keystore") bytes, alias $KEY_ALIAS"

      - name: Prepare release artifacts
        if: success()
        run: |
          mkdir -p dist
          # APK filename carries the tag version: IBO-TradingSignals-v<versionName>-release.apk
          # (e.g. tag v1.4.2 -> IBO-TradingSignals-v1.4.2-release.apk)
          cp app/build/outputs/apk/release/*.apk "dist/IBO-TradingSignals-${GITHUB_REF_NAME}-release.apk"
          cp app/build/outputs/apk/debug/*.apk "dist/IBO-TradingSignals-${GITHUB_REF_NAME}-debug.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          # Fingerprint derived from the secret-backed keystore of THIS run
          keytool -list -v \
            -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            2>/dev/null | grep -E 'SHA256:' | head -1 > SIGNING_FINGERPRINT.txt || echo "unavailable" > SIGNING_FINGERPRINT.txt

      - name: Create GitHub Release with installable APKs
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: IBO Trading Signals ${{ github.ref_name }}
          body: |
            ✅ همه‌ی ۱۰ سطح تست ۱۰۰٪ پاس شدند (backend compile/test، server-authority، security،
            migrations، UI uniformity، unit tests، APK build، installability، full health).
            📲 نصب: فایل release.apk را دانلود و نصب کنید — امضای ثابت، نصب‌به‌روزرسانی روی نسخه قبل.
            🛡 برای اطمینان از اصالت، SHA-256 فایل را با SHA256SUMS.txt مقایسه کنید.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/SIGNING_FINGERPRINT.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
